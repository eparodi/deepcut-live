# Docker config for SRS. This file is mounted over the image's default
# conf/docker.conf (the entrypoint loads THAT file, not conf/srs.conf).
# It keeps the image's standard blocks (RTMP, HTTP API/server, RTC) and
# adds the DeepCut HLS tuning + http_hooks callbacks.

listen              1935;
max_connections     1000;
# For docker, please use docker logs to manage the logs of SRS.
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    # Serve everything SRS writes (live HLS) plus the mounted static dirs:
    #   /data/hls/live/*.m3u8  -> /live/*.m3u8   (live playback)
    #   /data/hls/vods/...     -> /vods/...      (processed VOD HLS)
    #   /data/hls/thumbnails/..-> /thumbnails/.. (live + VOD thumbnails)
    dir             /data/hls;
}

rtc_server {
    enabled on;
    listen 8000;
    # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#config-candidate
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        # 2s segments, 6-segment window (see specs/hls-low-latency.md).
        # Note: LL-HLS (hls_ll_enabled/hls_ll_fragment) is NOT available in
        # SRS 5.0 — it was removed upstream, so we use short 2s segments
        # instead for low-ish latency.
        hls_fragment    2;
        hls_window      6;
        hls_path        /data/hls;
        # hls_ctx wraps every playlist in a master playlist that points at
        # a root-absolute child URL (/vods/...?...hls_ctx=...). Through the
        # frontend's /hls/* proxy the root-absolute path loses the /hls
        # prefix and 404s. We don't need per-session HLS auth, so disable.
        hls_ctx         off;
    }

    http_hooks {
        enabled         on;
        on_publish      http://backend:8081/api/srs/callback?secret=dev-srs-secret;
        on_unpublish    http://backend:8081/api/srs/callback?secret=dev-srs-secret;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled     on;
        # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#rtmp-to-rtc
        rtmp_to_rtc on;
        # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#rtc-to-rtmp
        rtc_to_rtmp on;
    }
}
