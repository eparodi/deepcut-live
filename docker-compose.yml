services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgres://live:live@postgres:5432/live?sslmode=disable
      PORT: "8081"
      BASE_URL: http://localhost:3000
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SRS_CALLBACK_SECRET: dev-srs-secret
      VOD_QUEUE_MAX_WORKERS: ${VOD_QUEUE_MAX_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/hls:/data/hls
      - ./data/recordings:/data/recordings

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgres://live:live@postgres:5432/live?sslmode=disable
      VOD_ENCODING_PRESET: copy
      VOD_WORKER_MAX_WORKERS: ${VOD_WORKER_MAX_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/hls:/data/hls
      - ./data/recordings:/data/recordings

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: live
      POSTGRES_PASSWORD: live
      POSTGRES_DB: live
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U live"]
      interval: 3s
      timeout: 3s
      retries: 5

  srs:
    image: ossrs/srs:5
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./data/srs.conf:/usr/local/srs/conf/srs.conf
      - ./data/hls:/data/hls
      - ./data/recordings:/usr/local/srs/objs/nginx/html/recordings
      - ./data/hls/thumbnails:/usr/local/srs/objs/nginx/html/thumbnails
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
